name: Build Geode Mod
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode SDK
        uses: geode-sdk/setup-geode-action@v1
        with:
          geode-version: "3.9.0"

      - name: Build mod
        run: geode build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/package/*.geode
