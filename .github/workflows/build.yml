name: Build Geode Mod
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          irm https://raw.githubusercontent.com/geode-sdk/cli/main/install.ps1 | iex

      - name: Install Geode SDK 3.9.0
        run: geode sdk install --version 3.9.0 --yes

      - name: Build the mod
        run: geode build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/package/*.geode
