name: Build Geode Mod
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Geode CLI 3.9.0 via winget
        run: winget install -e --id GeodeSDK.GeodeCLI --version 3.9.0 --accept-package-agreements --accept-source-agreements

      - name: Add winget install path to PATH
        run: echo "C:\Program Files\Geode SDK\CLI" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Geode SDK
        run: geode sdk install --version 3.9.0 --yes

      - name: Build mod
        run: geode build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/package/*.geode
