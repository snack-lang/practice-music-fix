name: Build Geode Mod
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Geode CLI 3.9.0
        run: |
          $cliUrl = "https://github.com/geode-sdk/cli/releases/download/v3.9.0/geode-windows.exe"
          Invoke-WebRequest -Uri $cliUrl -OutFile "geode.exe"
          echo "$PWD" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Geode SDK
        run: .\geode.exe sdk install --version 3.9.0 --yes

      - name: Build mod
        run: .\geode.exe build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod
          path: build/package/*.geode
